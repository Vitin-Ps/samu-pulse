spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: samu-pulse
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    out-of-order: false
    ignore-migration-patterns: "*:future"
    placeholder-replacement: true

  servlet:
    multipart:
      enabled: true
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:10MB}

  security:
    jwt:
      secret: ${JWT_SECRET:12345678901234567890123456789012}
      expiration-ms: ${JWT_EXPIRATION_MS:604800000}
    debug-errors: ${DEBUG_ERRORS:false}

  senha:
    first-acesso: ${SENHA_FIRST_ACESSO:123456}

  app:
    messages:
      field:
        required:
          message: "O Campo ({{campo_value}}) não pode estar vazio!"

# --- CONFIGURAÇÕES QUE ESTAVAM DENTRO DE "spring" POR ENGANO ---

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

file:
  upload-dir: ${URL_UPLOADS:docs_upload}
